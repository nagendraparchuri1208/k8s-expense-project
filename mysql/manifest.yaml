apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: expense
  labels:
    component: mysql
    tier: db
    project: expense

spec:
  replicas: 3

  selector:
    matchLabels:
      tier: db
      component: mysql
      project: expense
  template:
    metadata:
      labels:
        tier: db
        component: mysql
        project: expense

    spec:
      containers:
        - name: mysql
          image: joindevops/mysql:v1.0

---
apiVersion: v1
kind: Service

metadata:
  name: mysql
  namespace: expense
  labels:
    component: mysql
    tier: db
    project: expense

spec:
  type: ClusterIP

  selector:
    tier: db
    component: mysql
    project: expense

  ports:
    - port: 3306
      targetPort: 3306
